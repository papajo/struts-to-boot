[project]
name = "legacy-code-mapper"
version = "0.1.0"
description = "Static code map + business-rule extraction for legacy Java/Struts/Hibernate, served over MCP"
requires-python = ">=3.10"
dependencies = ["tree-sitter>=0.23", "tree-sitter-java>=0.23", "mcp>=2,<3", "pyyaml"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mapper = "mapper.cli:main"
mapper-mcp = "mapper.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
