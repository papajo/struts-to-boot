services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64   # Apple Silicon: runs under emulation
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mifos
      MYSQL_USER: mifos
      MYSQL_PASSWORD: mifos
    command: --max_connections=300 --innodb_file_per_table=1 --lower_case_table_names=1
    ports: ["${MYSQL_PORT:-3306}:3306"]
    # TCP check: during first-run init the entrypoint's temp server listens on the socket only,
    # so this passes only once the real server (with schema + data loaded) accepts connections.
    healthcheck:
      test: ["CMD", "mysql", "-h127.0.0.1", "-umifos", "-pmifos", "-e", "SELECT 1", "mifos"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
      - ../legacy-src/db/src/main/resources/sql/base-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../legacy-src/db/src/main/resources/sql/base-data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
      - ../legacy-src/db/src/main/resources/sql/init_mifos_password.sql:/docker-entrypoint-initdb.d/3-pw.sql:ro

  mifos:
    build:
      context: ../legacy-src
      dockerfile: ../legacy/Dockerfile
      additional_contexts:
        cfg: .
    depends_on:
      mysql: {condition: service_healthy}   # Mifos gives up on the DB at startup instead of retrying
    ports: ["${MIFOS_PORT:-18080}:8080"]
    environment:
      MIFOS_CONF: /mifos-conf
    volumes:
      - ./conf:/mifos-conf:ro

volumes:
  mysql-data:
