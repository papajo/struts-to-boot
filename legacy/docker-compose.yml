services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64   # Apple Silicon: runs under emulation
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mifos
      MYSQL_USER: mifos
      MYSQL_PASSWORD: mifos
    # Mifos predates 5.7 strict mode: its changesets use zero-date TIMESTAMP defaults.
    command: --max_connections=300 --innodb_file_per_table=1 --lower_case_table_names=1 --sql-mode=NO_ENGINE_SUBSTITUTION
    ports: ["${MYSQL_PORT:-3306}:3306"]
    # TCP check: during first-run init the entrypoint's temp server listens on the socket only,
    # so this passes only once the real server (with schema + data loaded) accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u mifos -pmifos --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql
      - ../legacy-src/db/src/main/resources/sql/base-schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ../legacy-src/db/src/main/resources/sql/base-data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
      - ../legacy-src/db/src/main/resources/sql/init_mifos_password.sql:/docker-entrypoint-initdb.d/3-pw.sql:ro

  mifos:
    build:
      context: ../legacy-src
      dockerfile: ../legacy/Dockerfile
      additional_contexts:
        cfg: .
    depends_on:
      mysql: {condition: service_healthy}   # Mifos gives up on the DB at startup instead of retrying
    ports: ["${MIFOS_PORT:-18080}:8080"]
    environment:
      MIFOS_CONF: /mifos-conf
      # acceptance mode = Mifos' own test hooks (/dateTimeUpdate.ftl); DB keys mirrored in local.properties
      JAVA_OPTIONS: "-Xms1024m -Xmx1024m -Dmifos.mode=acceptance"
    volumes:
      # Mifos writes into its config dir at startup (imageStore/, uploads), so the dir is a
      # writable volume (owned by jetty, see Dockerfile) and only local.properties comes from git.
      - mifos-conf:/mifos-conf
      - ./conf/local.properties:/mifos-conf/local.properties:ro

volumes:
  mysql-data:
  mifos-conf:
