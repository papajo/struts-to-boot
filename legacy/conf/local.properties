main.database=mifos
main.database.host=mysql
main.database.port=3306
main.database.user=mifos
main.database.password=mifos
# -Dmifos.mode=acceptance (docker-compose) enables /dateTimeUpdate.ftl so the harness can pin "today";
# that mode reads acceptance.* keys, so mirror main.* (and main's params: no FOREIGN_KEY_CHECKS=0).
acceptance.database=mifos
acceptance.database.host=mysql
acceptance.database.port=3306
acceptance.database.user=mifos
acceptance.database.password=mifos
acceptance.database.params=useUnicode=true&characterEncoding=UTF-8
acceptance.database.hibernate.c3p0.timeout=3000
